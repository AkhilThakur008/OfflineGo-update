name: Auto Fetch and Build Map

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests osmium

      - name: Run Map Fetch Script
        run: python scripts/fetch_map.py

      - name: Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v1
        with:
          tag_name: map-v-${{ github.run_number }}
          name: Automated Map Release ${{ github.run_number }}
          files: punjab-tiles.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
